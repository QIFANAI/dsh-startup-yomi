name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: smoke
        run: npm test
      - name: public checks
        if: runner.os == 'Linux' && matrix.node == '20'
        run: npm run check

  package-repro:
    name: package reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: pin npm
        run: npm install -g npm@11.19.0
      - name: rebuild and compare release.json
        run: node scripts/build-release.mjs --mode source --verify-manifest
